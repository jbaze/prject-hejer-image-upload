<header class="h-[60px] bg-gray-100 w-full shadow-sm flex justify-end items-center">
  <!-- Right side: User Info -->
  <div class="px-4 flex items-center gap-4">
    <!-- User Name -->
    <div class="flex items-center gap-2 text-gray-700 font-medium">
      <span><b>{{ currentUser?.fullName }}</b></span>
    </div>

    <!-- Logout Button -->
    <button
      (click)="logOut()"
      class="flex items-center gap-2 px-4 py-2 rounded-md hover:bg-red-500 hover:text-white transition-colors duration-200"
    >
      <svg xmlns="http://www.w3.org/2000/svg" 
          class="w-5 h-5" 
          fill="none" 
          viewBox="0 0 24 24" 
          stroke="currentColor" 
          stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" 
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
      </svg>
      <span>Logout</span>
    </button>
  </div>
</header>
