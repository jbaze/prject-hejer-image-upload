<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  <div *ngFor="let lead of leads" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 hover:shadow-lg transition-shadow duration-300">
    <!-- Header with gradient and icon -->
    <div class="flex items-center gap-3 p-4 bg-indigo-500 text-white">
      <h3 class="text-lg font-bold">{{ lead.name }}</h3>
    </div>

    <!-- Body -->
    <div class="p-4 space-y-3">
      <!-- Email -->
      <div class="flex items-center gap-2 text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 12H8m8-4H8m8 8H8m12-6V6a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0l-8 5-8-5" />
        </svg>
        <span><strong>Email:</strong> {{ lead.email }}</span>
      </div>

      <!-- Phone -->
      <div class="flex items-center gap-2 text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.494a1 1 0 01-.272 1.062l-2.21 2.21a16.001 16.001 0 006.586 6.586l2.21-2.21a1 1 0 011.062-.272l4.494 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C10.477 21 3 13.523 3 5z" />
        </svg>
        <span><strong>Phone:</strong> {{ lead.phoneNumber }}</span>
      </div>

      <!-- Address -->
      <div class="flex items-center gap-2 text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 11c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2zm0 10s8-4.5 8-10c0-4.418-3.582-8-8-8S4 6.582 4 11c0 5.5 8 10 8 10z" />
        </svg>
        <span><strong>Address:</strong> {{ lead.address }}</span>
      </div>

      <!-- Created at -->
      <div class="flex items-center gap-2 text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span><strong>Created at:</strong> {{ lead.createdAt | date:'short' }}</span>
      </div>

      <!-- Button -->
      <button class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-800 text-white hover:bg-gray-700 transition"
        (click)="openGallery(lead.id, lead.name)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 16l4-4a2 2 0 012.828 0L16 16m-4-4l4-4a2 2 0 012.828 0L20 12M4 6h16M4 6v12a2 2 0 002 2h12a2 2 0 002-2V6" />
        </svg>
        <span>Images</span>
      </button>
    </div>
  </div>
</div>
