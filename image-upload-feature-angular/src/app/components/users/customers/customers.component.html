<table class="min-w-full border border-gray-200 rounded-lg overflow-hidden shadow-sm">
  <thead class="bg-gray-100">
    <tr>
      <th class="px-4 py-2 text-left text-gray-600">ID</th>
      <th class="px-4 py-2 text-left text-gray-600">Name</th>
      <th class="px-4 py-2 text-left text-gray-600">Email</th>
      <th class="px-4 py-2 text-left text-gray-600">Phone</th>
      <th class="px-4 py-2 text-left text-gray-600">Address</th>
      <th class="px-4 py-2 text-left text-gray-600">Created At</th>
      <th class="px-4 py-2 text-left text-gray-600">Images</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let customer of customers" class="hover:bg-gray-100 transition-colors">
      <td class="px-4 py-2 text-gray-700">{{ customer.id }}</td>
      <td class="px-4 py-2 text-gray-700 font-semibold">{{ customer.name }}</td>
      <td class="px-4 py-2 text-gray-500">{{ customer.email }}</td>
      <td class="px-4 py-2 text-gray-500">{{ customer.phoneNumber }}</td>
      <td class="px-4 py-2 text-gray-500">{{ customer.address }}</td>
      <td class="px-4 py-2 text-gray-500">{{ customer.createdAt | date:'short' }}</td>
      <td class="px-4 py-2">
        <button class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-800 text-white hover:bg-gray-700 transition" (click)="openGallery(customer.id, customer.name)">
          <svg xmlns="http://www.w3.org/2000/svg" 
              class="w-5 h-5" 
              fill="none" 
              viewBox="0 0 24 24" 
              stroke="currentColor" 
              stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" 
                  d="M4 16l4-4a2 2 0 012.828 0L16 16m-4-4l4-4a2 2 0 012.828 0L20 12M4 6h16M4 6v12a2 2 0 002 2h12a2 2 0 002-2V6" />
          </svg>
          <span>Images</span>
        </button>
      </td>
    </tr>
  </tbody>
</table>
