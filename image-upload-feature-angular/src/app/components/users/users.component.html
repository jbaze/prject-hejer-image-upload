<div class="min-h-[calc(100vh-60px)] flex flex-col md:flex-row bg-[#f9fafb]">
  <div class="flex justify-center w-full p-2 md:p-8 pt-2 md:pt-8">
    <div class="md:container lg:min-w-[1062px] h-full w-full">
      <!-- Tabs -->
      <div class="flex justify-center gap-4 mb-8">
        <button
          (click)="selectTab('customers')"
          [ngClass]="selectedTab === 'customers' ? 'bg-black text-white' : 'bg-white text-black border border-gray-300 hover:bg-gray-100'"
          class="px-6 w-[200px] py-2 rounded-md font-medium transition-colors duration-200"
        >
          Customers
        </button>
        <button
          (click)="selectTab('leads')"
          [ngClass]="selectedTab === 'leads' ? 'bg-black text-white' : 'bg-white text-black border border-gray-300 hover:bg-gray-100'"
          class="px-6 w-[200px] py-2 rounded-md font-medium transition-colors duration-200"
        >
          Leads
        </button>
      </div>

      <!-- Customers Tab -->
      <div *ngIf="selectedTab === 'customers'" class="p-4 md:p-8 min-h-[80%]">
        <div class="loading-container flex items-center justify-center" *ngIf="loadingCustomers">
          <svg class="animate-spin h-6 w-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="ml-2 text-gray-500">Loading customers...</span>
        </div>

        <div *ngIf="!loadingCustomers" class="overflow-x-auto bg-gradient-to-br h-full from-gray-50 via-white to-gray-50 rounded-2xl shadow-lg border border-gray-200/50 backdrop-blur-xl p-10">
          <h3 class="text-xl font-bold text-gray-800 mb-8">Customers ({{customers.length}})</h3>

          <!-- Empty state -->
          <div *ngIf="customers.length === 0" class="flex flex-col items-center justify-center text-gray-500 py-12">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10m-6 4h6m-8 4h8m-4-8v8" />
            </svg>
            <p class="text-lg font-medium">There are no customers yet.</p>
          </div>

          <!-- Table -->
          <app-customers-table *ngIf="customers.length > 0" [customers]="customers"></app-customers-table>
        </div>
      </div>

      <!-- Leads Tab -->
      <div *ngIf="selectedTab === 'leads'" class="p-4 md:p-8 min-h-[80%]">
        <div class="loading-container flex items-center justify-center" *ngIf="loadingLeads">
          <svg class="animate-spin h-6 w-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="ml-2 text-gray-500">Loading leads...</span>
        </div>

        <div *ngIf="!loadingLeads" class="bg-gradient-to-br h-full from-gray-50 via-white to-gray-50 rounded-2xl shadow-lg border border-gray-200/50 backdrop-blur-xl p-10">
          <h3 class="text-xl font-bold text-gray-800 mb-8">Leads ({{leads.length}})</h3>

          <!-- Empty state -->
          <div *ngIf="leads.length === 0" class="flex flex-col items-center justify-center text-gray-500 py-12">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18m-9 5h9" />
            </svg>
            <p class="text-lg font-medium">There are no leads yet.</p>
          </div>

          <!-- Cards -->
          <app-leads-cards *ngIf="leads.length > 0" [leads]="leads"></app-leads-cards>
        </div>
      </div>
    </div>
  </div>
</div>
